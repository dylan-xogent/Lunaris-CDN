<!doctype html>
<html lang="en" class="dark">
	<head>

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="any" />

		<meta name="theme-color" content="#050507" />
